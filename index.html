<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d11"><meta name="description" content="A little note, meant just for you."><title>A little something</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Italiana&display=swap" rel="stylesheet"><style>
:root{--ink:#100d11;--paper:#f6efed;--rose:#e99baa;--line:#ffffff20;--serif:'Italiana',Georgia,serif;--sans:'DM Sans',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 105%,#4b203044,transparent 48%),radial-gradient(ellipse at 88% 8%,#6c304126,transparent 36%),var(--photo, var(--ink));background-color:var(--ink);background-size:cover;background-position:center;color:var(--paper);font:300 15px var(--sans);overflow-x:hidden}body:before{content:"";position:fixed;inset:-25%;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#63304025,transparent 48%);animation:breath 12s ease-in-out infinite alternate}body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(1px 1px at 20% 30%,#f1b1bcaa 50%,transparent),radial-gradient(1px 1px at 70% 65%,#f1b1bc88 50%,transparent),radial-gradient(1px 1px at 44% 82%,#f1b1bc88 50%,transparent);background-size:180px 180px,240px 240px,300px 300px;animation:float 24s linear infinite}.chrome{position:fixed;z-index:3;inset:0 0 auto;padding:calc(22px + env(safe-area-inset-top)) 25px 0;display:flex;justify-content:space-between;align-items:center;color:#a99da2;font-size:10px;letter-spacing:.17em;text-transform:uppercase}.brand{display:flex;align-items:center;gap:10px}.dot{width:6px;height:6px;border:1px solid var(--rose);border-radius:50%;box-shadow:0 0 12px var(--rose)}button{font:inherit;cursor:pointer}.sound{border:1px solid var(--line);background:#ffffff05;color:#dfd3d6;border-radius:99px;padding:9px 13px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.sound:hover,.quiet:hover{border-color:#ffffff66;color:white}main{position:relative;z-index:2;min-height:100svh;display:grid;place-items:center;padding:100px 22px 75px}.scene{width:min(100%,620px);text-align:center;opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease;position:absolute;pointer-events:none}.scene.active{opacity:1;transform:none;position:relative;pointer-events:auto}.content{width:100%;animation:arrive .8s ease both}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#bd9ba4;margin:0 0 26px}.headline{font:400 clamp(42px,9vw,76px)/1.09 var(--serif);letter-spacing:-.025em;margin:0 auto;max-width:650px}.headline em{color:var(--rose);font-style:normal}.subline{color:#b5a9ad;line-height:1.8;font-size:14px;margin:20px auto 0;max-width:390px}.actions{display:flex;justify-content:center;gap:12px;margin-top:36px;flex-wrap:wrap}.btn{min-height:49px;padding:0 25px;border-radius:99px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;transition:transform .2s,box-shadow .3s,border-color .3s}.btn:active{transform:scale(.97)}.primary{border:1px solid #dfa0ad;background:linear-gradient(120deg,#d8899a,#bb6076);color:#1b1014;box-shadow:0 8px 34px #d16b8230}.primary:hover{box-shadow:0 8px 40px #e48b9d66;transform:translateY(-2px)}.quiet{border:1px solid var(--line);background:#ffffff05;color:#c5b9bd}.no-note{min-height:22px;color:#c99ba5;font-size:12px;margin:18px 0 0}.form{width:min(100%,470px);margin:30px auto 0;text-align:left}.field-label{display:block;color:#beafb3;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:11px}.answer{width:100%;min-height:56px;resize:vertical;background:#ffffff08;border:1px solid #ffffff24;border-radius:12px;padding:16px;color:var(--paper);font:300 15px/1.5 var(--sans);outline:none}.answer:focus{border-color:#dc899b99;box-shadow:0 0 0 3px #d96d8315,0 0 24px #bc516422}.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.step-count{color:#82767b;font-size:10px;letter-spacing:.12em}.range-wrap{margin:36px auto 0;max-width:420px}.range{width:100%;accent-color:#d8899a;touch-action:pan-y}.range-labels{display:flex;justify-content:space-between;color:#a99ca1;font-size:10px;margin-top:13px;gap:8px}.range-current{font:24px var(--serif);color:#e8b0b8;margin:20px 0 0}.card{max-width:480px;margin:27px auto 0;padding:22px 25px;border:1px solid #ffffff20;border-radius:14px;background:#ffffff08;line-height:1.8;color:#d2c4c8}.secret{margin:20px auto 0;color:#e8b2bb;font:24px/1.5 var(--serif);opacity:0;max-height:0;overflow:hidden;transition:.7s}.secret.show{opacity:1;max-height:150px}.footer{position:fixed;z-index:2;bottom:0;left:0;right:0;text-align:center;padding:0 20px calc(20px + env(safe-area-inset-bottom));font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#796e73}.progress{position:fixed;z-index:3;bottom:0;left:0;height:1px;background:var(--rose);width:0;transition:width .7s}.decline{position:fixed;z-index:5;inset:0;background:#100d11f5;display:grid;place-items:center;padding:28px;opacity:0;pointer-events:none;transition:opacity .5s}.decline.show{opacity:1;pointer-events:auto}.decline-box{max-width:400px;text-align:center}.decline-box p{color:#c6b9bd;line-height:1.9}.fade{opacity:0;animation:arrive 1s ease 1.5s forwards}@keyframes breath{to{transform:translate(3%,2%) scale(1.08);opacity:.7}}@keyframes float{to{background-position:180px -180px,-240px 240px,300px -300px}}@keyframes arrive{to{opacity:1}}@media(max-width:480px){.chrome{padding-left:19px;padding-right:19px}.headline{font-size:clamp(42px,11vw,60px)}.actions{margin-top:29px}.btn{min-height:51px}.range-labels{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><header class="chrome"><div class="brand"><span class="dot"></span><span id="brand"></span></div><button class="sound" id="sound">♪ &nbsp; sound off</button></header><main id="main" aria-live="polite"></main><div class="progress" id="progress"></div><footer class="footer" id="footer"></footer><div class="decline" id="decline"><div class="decline-box"><p class="eyebrow">no pressure, ever</p><h2 class="headline">Thank you for being honest.</h2><p id="declineCopy"></p><button class="btn quiet" id="back">Back</button></div></div><script>
/* PERSONALIZE EVERYTHING HERE */
var CONFIG={herName:"Her name",brand:"a note for you",opening:["there's something i've been meaning to ask you…","and I think I'm finally ready."],ask:"Will you date me?",noMessages:["Are you sure?","Maybe take another moment…","No pressure. You can say no, truly."],yes:["you just made me smile.","but now I want to know something…"],questions:["What do you like about me?","When did you first start seeing me differently?","What is your favorite thing about us?","If we could go anywhere together right now… where would you take me?"],sliderQuestion:"How much do you like me?",sliderLabels:["a little","more than a little","a lot","way too much"],finalTitle:"so… it's official.",finalLine:"I think I’ve been waiting for this moment.",personalMessage:"I’m really glad it’s you. I can’t wait to see where this goes — preferably somewhere with good coffee, a long walk, and no reason to check the time.",secretButton:"one more thing…",secretMessage:"I’ve had a little crush on you for longer than I let on.",accent:"#e99baa",backgroundImage:"",musicUrl:"",footer:"made quietly, with you in mind",storageKey:"little-note-answers-v1"};
document.documentElement.style.setProperty("--rose",CONFIG.accent);if(CONFIG.backgroundImage)document.documentElement.style.setProperty("--photo",'url("'+CONFIG.backgroundImage+'")');document.title="A little something for "+CONFIG.herName;document.getElementById("brand").textContent=CONFIG.brand;document.getElementById("footer").textContent=CONFIG.footer;document.getElementById("declineCopy").textContent=CONFIG.herName+", whatever your answer, I’m glad I got to ask. You can close this whenever you like.";var main=document.getElementById("main"),progress=document.getElementById("progress"),answers={},noCount=0,qi=0;try{answers=JSON.parse(localStorage.getItem(CONFIG.storageKey)||"{}")}catch(e){}function save(){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(answers))}catch(e){}}function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}function btn(t,c,a){return '<button class="btn '+c+'" data-action="'+a+'">'+t+'</button>'}function scene(html,n){main.innerHTML='<section class="scene active"><div class="content">'+html+'</div></section>';progress.style.width=(n/7*100)+"%"}function intro(){scene('<p class="eyebrow">a small, honest question</p><h1 class="headline">'+CONFIG.opening[0]+'</h1><p class="subline fade">'+CONFIG.opening[1]+'</p><div class="actions">'+btn('continue','primary','ask')+'</div>',0)}function ask(){scene('<p class="eyebrow">just between us</p><h1 class="headline"><em>'+CONFIG.herName+'</em>…<br>'+CONFIG.ask+'</h1><div class="actions">'+btn('Yes','primary','yes')+btn('No','quiet','no')+'</div><p class="no-note" id="noNote"></p><button class="no-note quiet" data-action="decline">I’d rather say no</button>',1)}function welcome(){scene('<p class="eyebrow">I had a feeling</p><h1 class="headline">'+CONFIG.yes[0]+'</h1><p class="subline">'+CONFIG.yes[1]+'</p><div class="actions">'+btn('tell me','primary','question')+'</div>',2)}function question(){if(qi>=CONFIG.questions.length){slider();return}scene('<p class="eyebrow">a little curiosity · 0'+(qi+1)+'</p><h1 class="headline">'+CONFIG.questions[qi]+'</h1><div class="form"><label class="field-label" for="answer">your answer</label><textarea id="answer" class="answer" rows="2" placeholder="Take your time…">'+esc(answers['q'+qi]||'')+'</textarea><div class="form-actions"><span class="step-count">0'+(qi+1)+' / 05</span>'+btn(qi===3?'one last one':'continue','primary','next')+'</div></div>',3+qi)}function slider(){scene('<p class="eyebrow">one last question…</p><h1 class="headline">'+CONFIG.sliderQuestion+'</h1><div class="range-wrap"><input class="range" id="rating" type="range" min="0" max="3" step="1" value="'+(answers.rating===undefined?1:answers.rating)+'" aria-label="How much do you like me?"><div class="range-labels">'+CONFIG.sliderLabels.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div><p class="range-current" id="ratingLabel"></p></div><div class="actions">'+btn('that’s my answer','primary','finish')+'</div>',7);var r=document.getElementById('rating');function upd(){answers.rating=+r.value;document.getElementById('ratingLabel').textContent=CONFIG.sliderLabels[r.value];save()}r.addEventListener('input',upd);upd()}function final(){scene('<p class="eyebrow">a new little beginning</p><h1 class="headline"><em>'+CONFIG.finalTitle+'</em></h1><p class="subline">'+CONFIG.finalLine+'</p><div class="card">'+CONFIG.personalMessage+'</div><div class="actions">'+btn(CONFIG.secretButton,'quiet','secret')+'</div><p class="secret" id="secret">'+CONFIG.secretMessage+'</p>',8)}main.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;var a=b.dataset.action;if(a==='ask')ask();if(a==='yes')welcome();if(a==='question'){qi=0;question()}if(a==='no'){document.getElementById('noNote').textContent=CONFIG.noMessages[Math.min(noCount,CONFIG.noMessages.length-1)];noCount++;if(noCount>1)b.style.transform='translate('+(Math.random()*18-9)+'px, 2px)'}if(a==='decline')document.getElementById('decline').classList.add('show');if(a==='next'){answers['q'+qi]=document.getElementById('answer').value.trim();save();qi++;question()}if(a==='finish'){save();final()}if(a==='secret')document.getElementById('secret').classList.toggle('show')});document.getElementById('back').onclick=function(){document.getElementById('decline').classList.remove('show')};intro();var audio=CONFIG.musicUrl?new Audio(CONFIG.musicUrl):null;if(audio)audio.loop=true;document.getElementById('sound').onclick=async function(){if(!audio){this.textContent='♪  add music URL';return}if(audio.paused){try{await audio.play();this.textContent='♪  sound on'}catch(e){this.textContent='♪  unavailable'}}else{audio.pause();this.textContent='♪  sound off'}};
</script></body></html>
